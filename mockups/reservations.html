<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JH PULSE LAB - 예약 내역</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="canvas">
      <section class="mock-frame desktop-page page-shell">
        <header class="topbar">
          <div class="lead-block">
            <a class="button ghost" href="./home.html" style="width: fit-content">홈으로</a>
            <div>
              <span class="eyebrow">예약 조회</span>
              <h1 class="section-title large">예약 내역 조회</h1>
            </div>
            <p class="section-copy">이름과 연락처를 입력하면 예약 내역을 확인할 수 있습니다.</p>
          </div>
          <a class="button primary" href="./reservation.html">새 예약하기</a>
        </header>

        <section class="lookup-layout">
          <form class="lookup-form">
            <label class="field">
              <span>이름</span>
              <input class="input" value="홍길동" />
            </label>
            <label class="field">
              <span>연락처</span>
              <input class="input" value="010-1234-5678" />
            </label>
            <button class="button primary" type="button">조회하기</button>
          </form>

          <section class="page-shell">
            <div class="result-head">
              <div>
                <span class="eyebrow">조회 결과</span>
                <h2 class="section-title">조회 결과</h2>
              </div>
              <div class="result-count">3건</div>
            </div>

            <div class="reservation-list">
              <article class="reservation-row">
                <div class="time">15:00</div>
                <div class="room">강의실 1 · A룸</div>
                <div>
                  <strong>2026.06.11 목요일</strong>
                  <div class="memo">30분 예약</div>
                </div>
                <span class="badge confirmed">확정</span>
              </article>
              <article class="reservation-row">
                <div class="time">19:00</div>
                <div class="room">강의실 2 · B룸</div>
                <div>
                  <strong>2026.06.18 목요일</strong>
                  <div class="memo">1시간 예약</div>
                </div>
                <span class="badge pending">대기</span>
              </article>
              <article class="reservation-row">
                <div class="time">18:00</div>
                <div class="room">강의실 3 · C룸</div>
                <div>
                  <strong>2026.05.28 목요일</strong>
                  <div class="memo">1시간 예약</div>
                </div>
                <span class="badge cancelled">취소</span>
              </article>
            </div>
          </section>
        </section>
      </section>
    </main>
  </body>
</html>
