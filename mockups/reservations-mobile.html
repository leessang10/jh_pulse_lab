<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JH PULSE LAB - 예약 내역 모바일</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-page">
      <section class="phone-frame mobile-page">
        <header class="mobile-top">
          <a class="button ghost" href="./home-mobile.html" style="width: fit-content">홈으로</a>
          <span class="eyebrow">예약 조회</span>
          <h1 class="section-title">예약 내역 조회</h1>
          <p class="section-copy">이름과 연락처를 입력하세요.</p>
        </header>

        <form class="field-grid">
          <label class="field"><span>이름</span><input class="input" value="홍길동" /></label>
          <label class="field"><span>연락처</span><input class="input" value="010-1234-5678" /></label>
          <button class="button primary" type="button">조회하기</button>
        </form>

        <section class="mobile-section">
          <div class="result-head">
            <h2 class="section-title">조회 결과</h2>
            <div class="result-count">3건</div>
          </div>
          <div class="mobile-table-list">
            <article class="mobile-table-row">
              <div class="mobile-row-head"><strong>15:00</strong><span class="badge confirmed">확정</span></div>
              <div class="mobile-muted">2026.06.11 목 · 강의실 1 · 30분</div>
            </article>
            <article class="mobile-table-row">
              <div class="mobile-row-head"><strong>19:00</strong><span class="badge pending">대기</span></div>
              <div class="mobile-muted">2026.06.18 목 · 강의실 2 · 1시간</div>
            </article>
            <article class="mobile-table-row">
              <div class="mobile-row-head"><strong>18:00</strong><span class="badge cancelled">취소</span></div>
              <div class="mobile-muted">2026.05.28 목 · 강의실 3 · 1시간</div>
            </article>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
