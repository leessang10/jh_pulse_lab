<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JH PULSE LAB - 예약 모바일</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-page">
      <section class="phone-frame mobile-page">
        <header class="mobile-top">
          <a class="button ghost" href="./home-mobile.html" style="width: fit-content">홈으로</a>
          <span class="eyebrow">01 시간 선택</span>
          <h1 class="section-title">예약 시간 선택</h1>
        </header>

        <section class="mobile-section">
          <div class="control-label">강의실</div>
          <div class="segmented" data-active-group>
            <button class="choice active" type="button" data-room-select="강의실 1">강의실 1</button>
            <button class="choice" type="button" data-room-select="강의실 2">강의실 2</button>
            <button class="choice" type="button" data-room-select="강의실 3">강의실 3</button>
          </div>
        </section>

        <section class="mobile-section">
          <div class="control-label">이용 시간</div>
          <div class="segmented" data-active-group>
            <button class="choice active" type="button">30분</button>
            <button class="choice" type="button">1시간</button>
          </div>
        </section>

        <section class="mobile-section" data-time-group>
          <div class="control-label">시작 시간</div>
          <div class="mobile-time-grid">
            <button class="slot" type="button" data-time-slot="09:00 - 09:30">09:00</button>
            <button class="slot" type="button" data-time-slot="09:30 - 10:00">09:30</button>
            <button class="slot disabled" type="button">10:00</button>
            <button class="slot" type="button" data-time-slot="12:00 - 12:30">12:00</button>
            <button class="slot" type="button" data-time-slot="13:00 - 13:30">13:00</button>
            <button class="slot active" type="button" data-time-slot="15:00 - 15:30">15:00</button>
            <button class="slot" type="button" data-time-slot="16:00 - 16:30">16:00</button>
            <button class="slot" type="button" data-time-slot="17:30 - 18:00">17:30</button>
            <button class="slot" type="button" data-time-slot="19:00 - 19:30">19:00</button>
          </div>
        </section>

        <section class="mobile-summary">
          <span class="eyebrow">예약 정보</span>
          <div class="summary-item"><span>강의실</span><strong data-selected-room>강의실 1</strong></div>
          <div class="summary-item"><span>시간</span><strong data-selected-time>15:00 - 15:30</strong></div>
        </section>

        <div class="bottom-action">
          <button class="button primary" type="button">예약자 정보 입력</button>
        </div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
